services:
  server:
    build:
      context: ./apps/server
      dockerfile: dockerfile

    # Reached by the shared VPS nginx as http://rag-server:8000.
    networks:
      default:
      proxy:
        aliases: [rag-server]

    environment:
      NODE_ENV: production
      PORT: 8000

      # Qdrant (runs outside this project)
      QDRANT_URL: ${QDRANT_URL}

      # Valkey
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379

      # BullMQ
      BULL_MQ_HOST: valkey
      BULL_MQ_PORT: 6379

      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # LangSmith
      LANGSMITH_TRACING: ${LANGSMITH_TRACING}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT}

    volumes:
      - uploads:/app/uploads

    depends_on:
      - valkey

    restart: unless-stopped

  worker:
    build:
      context: ./apps/server
      dockerfile: dockerfile

    command: ["node", "worker.js"]

    # On proxy only to reach the standalone Qdrant container.
    networks:
      default:
      proxy:

    environment:
      NODE_ENV: production

      # Valkey
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379

      # Qdrant (runs outside this project)
      QDRANT_URL: ${QDRANT_URL}

      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}

    volumes:
      - uploads:/app/uploads

    depends_on:
      - valkey

    restart: unless-stopped

  client:
    build:
      context: ./apps/client
      dockerfile: dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}

    # Reached by the shared VPS nginx as http://rag-client:3000.
    networks:
      default:
      proxy:
        aliases: [rag-client]

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}

    depends_on:
      - server

    restart: unless-stopped

  valkey:
    image: valkey/valkey

    volumes:
      - valkey_data:/data

    restart: unless-stopped

volumes:
  # Uploaded PDFs
  uploads:

  # Valkey data
  valkey_data:

networks:
  # Shared with the standalone nginx and Qdrant containers. Once on the VPS:
  #   docker network create proxy
  #   docker network connect proxy <qdrant-container>
  proxy:
    external: true
