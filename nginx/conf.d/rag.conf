server {
    listen 80;
    server_name rag.ranjandev.tech;

    # Keep this for Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl;
    server_name rag.ranjandev.tech;

    ssl_certificate /etc/letsencrypt/live/rag.ranjandev.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rag.ranjandev.tech/privkey.pem;

    location / {
        proxy_pass http://client:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket / Next.js support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}